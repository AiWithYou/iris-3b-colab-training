name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      PYTHONPATH: ${{ github.workspace }}/vendor/iris-3b/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install "torch>=2.7.1,<2.14" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Fetch pinned Iris source
        run: |
          git clone --no-checkout https://github.com/speridlabs/iris-3b.git vendor/iris-3b
          git -C vendor/iris-3b checkout --detach a8d15239dea469aba042cfa56ca3bb4e450d5ebc
      - name: Verify generated notebooks
        run: |
          python build_full_notebook.py
          python build_continuation_notebook.py
          git diff --exit-code -- '*.ipynb'
      - name: Run CPU behavioral tests
        run: python -m pytest -q tests
